<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>银盾</title>
<style>
/* ============================================================
   老人端首页 —— 一眼回答：现在安不安全
   ------------------------------------------------------------
   视觉：冷白底 + 深海军蓝"安全核心"卡 + 盾牌圆环（与红屏、子女端同一图形）
   字号：正文 ≥20px，按钮 ≥22px，按钮高 ≥64px
   注意：不要加无限循环的 CSS 动画 —— 模拟器 WebView 走软件渲染，
         循环阴影动画会把主线程塞满导致 ANR（2026-11-09 实测）。
   ============================================================ */
:root{
  --bg:#F3F5F8; --card:#FFFFFF; --line:#E4E8EE; --line2:#DDE2EA;
  --ink:#0B1220; --ink2:#475467; --ink3:#667085;
  --navy:#0A1A33; --blue:#2B6CF6; --blueBg:#EEF3FD; --blueLt:#7FB0FF;
  --ok:#0F7A4A; --okDot:#12B76A; --okLt:#32D583;
  --warn:#B54708; --warnLt:#FEC84B; --warnBg:#FEF0C7;
  --bad:#B42318; --badBg:#FEE4E2;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{
  font-family:"Noto Sans CJK SC","Source Han Sans SC","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  color:var(--ink);min-height:100vh;display:flex;flex-direction:column;gap:14px;
  padding:14px 18px 20px;
}
.num{font-family:Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
svg{display:block}

/* 顶栏 */
.top{display:flex;align-items:center;justify-content:space-between;height:48px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mk{width:36px;height:36px;border-radius:11px;background:var(--navy);display:flex;align-items:center;justify-content:center}
.brand b{font-size:22px;font-weight:900;letter-spacing:2px}
.btn-set{height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line2);background:#fff;
  font-size:18px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:6px}

/* 安全核心卡 */
.core{position:relative;overflow:hidden;border-radius:26px;padding:22px 22px 18px;color:#fff;
  background:radial-gradient(circle at 80% 28%,#1C3F78 0%,#0F2448 38%,#0A1A33 70%);
  box-shadow:0 12px 28px rgba(10,26,51,.22)}
.core .ring{position:absolute;border-radius:50%;border:1px solid rgba(127,176,255,.18)}
.core .r1{width:196px;height:196px;right:-30px;top:-34px}
.core .r2{width:136px;height:136px;right:0;top:-4px;border-color:rgba(127,176,255,.28)}
.core .emb{position:absolute;right:30px;top:26px;width:76px;height:76px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(50,213,131,.12);border:1.5px solid rgba(50,213,131,.55)}
.core.alert .r1,.core.alert .r2{border-color:rgba(253,176,34,.25)}
.core.alert .emb{background:rgba(253,176,34,.12);border-color:rgba(253,176,34,.6)}
.core .lbl{position:relative;font-size:15px;color:#8FA3C4;letter-spacing:2px}
.core .head{position:relative;font-size:46px;font-weight:900;line-height:1.15;margin-top:4px}
.core.alert .head{color:var(--warnLt)}
.core .sub{position:relative;font-size:18px;color:#C3CFE2;line-height:1.45;margin-top:4px;max-width:220px;min-height:52px}
.core .today{position:relative;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
.core .today .t{font-size:15px;color:#8FA3C4}
.core .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}
.core .stats div{display:flex;align-items:baseline;gap:4px}
.core .stats .n{font-size:28px;font-weight:700}
.core .stats .u{font-size:16px;color:#C3CFE2}
.core.alert .stats .hl{color:var(--warnLt)}

/* 五道防线 */
.sec{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.sec b{font-size:19px}
.sec span{display:flex;align-items:center;gap:6px;font-size:17px;font-weight:500;color:var(--ok)}
.sec span i{width:8px;height:8px;border-radius:50%;background:var(--okDot)}
.sec span.off{color:var(--warn)} .sec span.off i{background:#F79009}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;
  display:flex;flex-direction:column;gap:10px;text-align:left;color:var(--ink)}
.tile .ic{width:40px;height:40px;border-radius:12px;background:var(--blueBg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tile .row{display:flex;align-items:center;justify-content:space-between}
.tile .nm{font-size:21px;font-weight:700}
.tile .st{font-size:16px;font-weight:500;color:var(--ok)}
.tile .st.off{color:var(--warn)}
.tile.wide{grid-column:span 2;flex-direction:row;align-items:center;gap:12px;padding:12px 16px}
.tile.wide .tx{flex:1;display:flex;flex-direction:column}
.tile.wide .ds{font-size:15px;color:var(--ink3)}

/* 底部按钮 */
.spacer{flex:1}
.acts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.btn-call{grid-column:span 3;height:66px;border:none;border-radius:20px;background:var(--navy);color:#fff;
  font-size:23px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 8px 20px rgba(10,26,51,.25)}
.btn-call:active{background:#152B4F}
.btn-drill{grid-column:span 2;height:66px;border-radius:20px;border:1px solid var(--line2);background:#fff;
  color:var(--ink);font-size:21px;font-weight:700}

/* 设置面板 */
.mask{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(11,18,32,.45);display:none}
.mask.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;
  padding:20px 20px 28px;display:none;flex-direction:column;gap:12px;max-height:88vh;overflow-y:auto}
.sheet.on{display:flex}
.sheet h2{font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:space-between}
.sheet h2 button{width:48px;height:48px;border-radius:24px;border:1px solid var(--line2);background:#fff;
  display:flex;align-items:center;justify-content:center}
.field{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:18px;background:var(--bg)}
.field label{font-size:18px;font-weight:700;color:var(--ink2)}
.field .in{display:flex;gap:10px}
.field input{flex:1;min-width:0;height:56px;border-radius:14px;border:1.5px solid var(--line2);padding:0 14px;
  font-size:22px;font-family:inherit;color:var(--ink);background:#fff}
.field input:focus{outline:none;border-color:var(--blue)}
.field .save{height:56px;padding:0 18px;border-radius:14px;border:none;background:var(--navy);color:#fff;font-size:20px;font-weight:700}
.field .hint{font-size:15px;color:var(--ink3)}
.item{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 16px;border-radius:18px;
  border:1px solid var(--line);background:#fff;text-align:left;width:100%}
.item .tx{flex:1;display:flex;flex-direction:column}
.item .tx b{font-size:20px;color:var(--ink)}
.item .tx span{font-size:15px;color:var(--ink3)}
.item .go{font-size:17px;font-weight:700;color:var(--blue)}
</style>
</head>
<body>

<div class="top">
  <div class="brand">
    <div class="mk"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7FB0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/></svg></div>
    <b>银盾</b>
  </div>
  <button class="btn-set" onclick="openSheet()">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0B1220" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10"/><path d="M18 7h2"/><circle cx="16" cy="7" r="2"/><path d="M4 17h2"/><path d="M10 17h10"/><circle cx="8" cy="17" r="2"/></svg>
    设置
  </button>
</div>

<div class="core" id="core">
  <div class="ring r1"></div>
  <div class="ring r2"></div>
  <div class="emb" id="emb"></div>
  <div class="lbl">防护状态</div>
  <div class="head" id="head">安全</div>
  <div class="sub" id="sub">实时防护已开启</div>
  <div class="today">
    <div class="t">今日检测</div>
    <div class="stats">
      <div><span class="n num" id="nMsg">0</span><span class="u">条消息</span></div>
      <div><span class="n num" id="nCall">0</span><span class="u">通来电</span></div>
      <div><span class="n num hl" id="nAlert">0</span><span class="u">次预警</span></div>
    </div>
  </div>
</div>

<div class="sec">
  <b>防护项目</b>
  <span id="allState"><i></i><em style="font-style:normal" id="allTx">全部开启</em></span>
</div>

<div class="grid">
  <button class="tile" onclick="fixPerm()">
    <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B6CF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg></div>
    <div class="row"><span class="nm">短信识别</span><span class="st" data-need="perm">已开启</span></div>
  </button>
  <button class="tile" onclick="fixPerm('notify')">
    <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B6CF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 12h.01"/><path d="M12 12h.01"/><path d="M15.5 12h.01"/></svg></div>
    <div class="row"><span class="nm">微信识别</span><span class="st" data-need="perm">已开启</span></div>
  </button>
  <button class="tile" onclick="fixPerm()">
    <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B6CF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></div>
    <div class="row"><span class="nm">来电识别</span><span class="st" data-need="perm">已开启</span></div>
  </button>
  <button class="tile" onclick="fixPerm('usage')">
    <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B6CF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18"/><path d="M5.5 10v7.5"/><path d="M10 10v7.5"/><path d="M14 10v7.5"/><path d="M18.5 10v7.5"/><path d="M3 20.5h18"/><path d="M12 3.5l9 4.5H3l9-4.5z"/></svg></div>
    <div class="row"><span class="nm">转账保护</span><span class="st" data-need="perm">已开启</span></div>
  </button>
  <button class="tile wide" onclick="toggleRec()">
    <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B6CF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4"/><path d="M8 7v10"/><path d="M12 4v16"/><path d="M16 7v10"/><path d="M20 10v4"/></svg></div>
    <div class="tx"><span class="nm">通话复盘</span><span class="ds" id="recSub">挂断陌生来电后自动分析录音</span></div>
    <span class="st" id="recTx">已开启</span>
  </button>
</div>

<div class="spacer"></div>

<div class="acts">
  <button class="btn-call" onclick="callChild()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7FB0FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
    联系女儿
  </button>
  <button class="btn-drill" onclick="startDrill()">反诈演练</button>
</div>

<!-- 设置面板：银盾自己的设置，不再把老人扔进系统设置页 -->
<div class="mask" id="mask" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <h2>设置
    <button aria-label="关闭" onclick="closeSheet()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B1220" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>
  </h2>
  <div class="field">
    <label for="childNum">紧急联系人（女儿）</label>
    <div class="in"><input id="childNum" type="tel" inputmode="tel" placeholder="请输入手机号码"><button class="save" onclick="saveChild()">保存</button></div>
    <span class="hint" id="childHint">发生高风险情况时，银盾将自动呼叫此号码</span>
  </div>
  <button class="item" onclick="toggleRec()">
    <span class="tx"><b>通话复盘</b><span id="recSet">陌生来电挂断后分析通话录音</span></span>
    <span class="go">设置</span>
  </button>
  <button class="item" onclick="fixPerm('overlay')">
    <span class="tx"><b>悬浮窗权限</b><span>用于显示风险提示与拦截界面</span></span>
    <span class="go">前往设置</span>
  </button>
  <button class="item" onclick="fixPerm('notify')">
    <span class="tx"><b>通知使用权</b><span>用于识别微信消息中的诈骗信息</span></span>
    <span class="go">前往设置</span>
  </button>
  <button class="item" onclick="fixPerm('usage')">
    <span class="tx"><b>使用情况访问权限</b><span>用于识别通话期间打开的银行应用</span></span>
    <span class="go">前往设置</span>
  </button>
  <button class="item" onclick="fixPerm('battery')">
    <span class="tx"><b>电池优化白名单</b><span>防止银盾在后台被系统关闭</span></span>
    <span class="go">前往设置</span>
  </button>
</div>

<script>
/* 这一页没有判定逻辑：只显示原生送来的状态和数字 */
var B = window.SilverBridge || null;
function call(fn, arg){ try { return B && B[fn] ? (arg === undefined ? B[fn]() : B[fn](arg)) : null; } catch(e){ return null; } }

var ICON_OK = '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#32D583" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>';
var ICON_ALERT = '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FDB022" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><path d="M12 8.5v4"/><path d="M12 15.5v.3"/></svg>';

function render(){
  var s = {};
  try { s = JSON.parse(call('stats') || '{}'); } catch(e){}
  document.getElementById('nMsg').textContent = (s.sms || 0) + (s.wx || 0);
  document.getElementById('nCall').textContent = s.call || 0;
  document.getElementById('nAlert').textContent = s.alert || 0;

  var core = document.getElementById('core');
  var last = s.last;
  // 两小时内有过 high/block → 显示"请留意"；更早的只在副标题里提一句
  var hot = last && last.today && last.mins < 120 && (last.level === 'high' || last.level === 'block');
  if (hot) {
    core.className = 'core alert';
    document.getElementById('emb').innerHTML = ICON_ALERT;
    document.getElementById('head').textContent = '存在风险';
    document.getElementById('sub').textContent = last.time + ' 检测到可疑情况，请暂缓转账';
  } else {
    core.className = 'core';
    document.getElementById('emb').innerHTML = ICON_OK;
    document.getElementById('head').textContent = '安全';
    document.getElementById('sub').textContent = (last && last.today)
      ? '今日 ' + last.time + ' 曾发出预警，目前已解除'
      : '银盾已持续守护 ' + (s.days || 1) + ' 天';
  }
  renderPerm();
}

function renderPerm(){
  var ok = call('ready');
  if (ok === null) ok = true;   // 浏览器里预览时没有原生桥
  var sts = document.querySelectorAll('[data-need="perm"]');
  for (var i = 0; i < sts.length; i++) {
    sts[i].textContent = ok ? '已开启' : '未开启';
    sts[i].className = ok ? 'st' : 'st off';
  }
  var rec = call('recState') || 'off';
  var recTx = document.getElementById('recTx');
  recTx.textContent = rec === 'on' ? '已开启' : (rec === 'noperm' ? '需授权' : '未开启');
  recTx.className = rec === 'on' ? 'st' : 'st off';
  document.getElementById('recSub').textContent = rec === 'noperm' ? '需授予文件访问权限，轻触前往设置' : '挂断陌生来电后自动分析录音';
  document.getElementById('recSet').textContent = rec === 'on' ? '已开启 · 轻触可关闭' : '未开启 · 轻触开启';

  var all = document.getElementById('allState');
  var allOk = ok && rec === 'on';
  all.className = allOk ? '' : 'off';
  document.getElementById('allTx').textContent = allOk ? '全部开启' : (ok ? '1 项未开启' : '部分权限未授予');
}

/* 原生推"判出了什么"（EventBus.pushAlert）：数字和状态立刻刷新 */
window.onAlert = function(o){ setTimeout(render, 50); };
window.onNativeEvent = function(o){};
/* 原生回调：录音复盘开关变了 */
window.refreshRec = renderPerm;

function toggleRec(){ call('recToggle'); }
function startDrill(){ call('openDrill'); }
function callChild(){ call('callChild'); }
function fixPerm(name){ call('openSetting', name || 'app'); }

function openSheet(){
  document.getElementById('childNum').value = call('childNumber') || '';
  document.getElementById('mask').className = 'mask on';
  document.getElementById('sheet').className = 'sheet on';
}
function closeSheet(){
  document.getElementById('mask').className = 'mask';
  document.getElementById('sheet').className = 'sheet';
}
function saveChild(){
  var v = document.getElementById('childNum').value.replace(/\s+/g, '');
  var hint = document.getElementById('childHint');
  if (!/^1\d{10}$|^\d{5,}$/.test(v)) { hint.textContent = '号码格式有误，请核对后重新输入'; hint.style.color = '#B42318'; return; }
  call('setChildNumber', v);
  hint.textContent = '已保存紧急联系人：' + v; hint.style.color = '#0F7A4A';
}

render();
// 从系统设置页回来时刷新；平时 20 秒刷一次数字（太频繁会让后台的银盾卡顿）
document.addEventListener('visibilitychange', function(){ if (!document.hidden) render(); });
setInterval(render, 20000);
</script>
</body>
</html>
